name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Service-layer tests run against mocked DAOs (Mockito) — no live database
      # needed in CI. DAO-level integration testing against real MySQL is a
      # local/manual step, not part of this workflow.
      - name: Compile
        run: mvn -B -ntp compile

      - name: Run tests
        run: mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
